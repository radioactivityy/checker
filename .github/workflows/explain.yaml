name: Code Explanation Generator

on:
  pull_request:
    paths:
      - "**.py"

jobs:
  explain:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Get changed Python files
        run: |
          git diff --name-only HEAD~1 HEAD -- '*.py' > changed_files.txt
          cat changed_files.txt

      - name: Generate explanations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/explain.py

      - name: Post as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('explanation_output.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });